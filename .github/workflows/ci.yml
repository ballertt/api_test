name: API Test CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行测试
        run: pytest testcase/ -n auto --html=reports/report.html --self-contained-html

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/report.html
